<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" preserveAspectRatio="xMidYMid slice">
  <defs>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#0b1f3a" stroke-opacity=".05" stroke-width="1"/>
    </pattern>
    <radialGradient id="fade" cx="50%" cy="50%" r="60%">
      <stop offset="0" stop-color="#fff" stop-opacity="1"/>
      <stop offset=".55" stop-color="#fff" stop-opacity=".6"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowTeal" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#1b8888" stop-opacity=".22"/>
      <stop offset="1" stop-color="#1b8888" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowBlue" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#1a4d8a" stop-opacity=".18"/>
      <stop offset="1" stop-color="#1a4d8a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowCyan" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#28a5cc" stop-opacity=".16"/>
      <stop offset="1" stop-color="#28a5cc" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="numGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a4d8a"/>
      <stop offset=".5" stop-color="#28a5cc"/>
      <stop offset="1" stop-color="#1b8888"/>
    </linearGradient>
    <linearGradient id="route" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1b8888" stop-opacity=".6"/>
      <stop offset="1" stop-color="#28a5cc" stop-opacity=".1"/>
    </linearGradient>
  </defs>

  <!-- base -->
  <rect width="1920" height="1080" fill="#ffffff"/>
  <rect width="1920" height="1080" fill="url(#grid)"/>

  <!-- soft brand glows -->
  <circle cx="1640" cy="160" r="520" fill="url(#glowTeal)"/>
  <circle cx="220" cy="960" r="480" fill="url(#glowBlue)"/>
  <circle cx="1500" cy="980" r="360" fill="url(#glowCyan)"/>

  <!-- giant faint 404 -->
  <text x="960" y="700" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="800" font-size="560" letter-spacing="-30" fill="none" stroke="url(#numGrad)" stroke-opacity=".12" stroke-width="3">404</text>

  <!-- orbit rings top-right -->
  <g fill="none" stroke-width="1.5">
    <circle cx="1720" cy="120" r="210" stroke="#1b8888" stroke-opacity=".28"/>
    <circle cx="1720" cy="120" r="320" stroke="#1b8888" stroke-opacity=".16"/>
    <circle cx="1720" cy="120" r="440" stroke="#28a5cc" stroke-opacity=".10" stroke-dasharray="4 10"/>
  </g>
  <circle cx="1514" cy="164" r="7" fill="#1b8888"/>
  <circle cx="1440" cy="360" r="5" fill="#28a5cc" fill-opacity=".8"/>

  <!-- orbit rings bottom-left -->
  <g fill="none" stroke-width="1.5">
    <circle cx="140" cy="980" r="150" stroke="#1a4d8a" stroke-opacity=".26"/>
    <circle cx="140" cy="980" r="250" stroke="#1a4d8a" stroke-opacity=".14"/>
    <circle cx="140" cy="980" r="360" stroke="#28a5cc" stroke-opacity=".10" stroke-dasharray="4 10"/>
  </g>
  <circle cx="290" cy="975" r="6" fill="#1a4d8a"/>
  <circle cx="370" cy="790" r="4" fill="#28a5cc" fill-opacity=".8"/>

  <!-- broken route: a path that wanders off and ends abruptly -->
  <path d="M120 300 C 340 240, 420 420, 620 380 S 820 230, 900 300" fill="none" stroke="url(#route)" stroke-width="2.5" stroke-dasharray="2 12" stroke-linecap="round"/>
  <circle cx="120" cy="300" r="9" fill="#fff" stroke="#1b8888" stroke-width="3"/>
  <g transform="translate(918 312)" stroke="#d24452" stroke-opacity=".55" stroke-width="3" stroke-linecap="round">
    <path d="M-9 -9 L9 9 M9 -9 L-9 9"/>
  </g>

  <path d="M1800 760 C 1640 820, 1600 680, 1420 720 S 1200 860, 1100 800" fill="none" stroke="#1a4d8a" stroke-opacity=".22" stroke-width="2.5" stroke-dasharray="2 12" stroke-linecap="round"/>
  <circle cx="1800" cy="760" r="9" fill="#fff" stroke="#1a4d8a" stroke-opacity=".5" stroke-width="3"/>
  <text x="1086" y="790" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="30" font-weight="700" fill="#1a4d8a" fill-opacity=".35">?</text>

  <!-- scattered nodes -->
  <g fill="#0b1f3a" fill-opacity=".18">
    <circle cx="560" cy="140" r="3"/><circle cx="760" cy="96" r="2"/>
    <circle cx="1260" cy="130" r="3"/><circle cx="1180" cy="960" r="3"/>
    <circle cx="700" cy="980" r="2"/><circle cx="1820" cy="560" r="3"/>
    <circle cx="80" cy="560" r="2.5"/><circle cx="460" cy="660" r="2"/>
  </g>

  <!-- floating code fragments -->
  <g font-family="JetBrains Mono, Consolas, monospace" font-size="18" fill="#0b1f3a" fill-opacity=".22">
    <text x="1380" y="470">GET /page → 404</text>
    <text x="260" y="180">route.notFound()</text>
    <text x="1500" y="900">{ status: 404 }</text>
  </g>

  <!-- keep center clean for content -->
  <ellipse cx="960" cy="540" rx="620" ry="340" fill="url(#fade)" opacity=".75"/>
</svg>
